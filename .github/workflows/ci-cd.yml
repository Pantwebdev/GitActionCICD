name: CI/CD

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test with Maven
        run: mvn --batch-mode --no-transfer-progress verify

  container:
    name: Build and publish container
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to AWS EC2
    needs: container
    runs-on: ubuntu-latest

    steps:
      - name: Deploy container over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_NAME: ghcr.io/pantwebdev/gitactioncicd:latest
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_NAME
          script: |
            set -eu
            test -n "$GHCR_USERNAME" || { echo "GHCR_USERNAME secret is empty"; exit 1; }
            test -n "$GHCR_TOKEN" || { echo "GHCR_TOKEN secret is empty"; exit 1; }
            sudo docker info
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            sudo docker pull "$IMAGE_NAME"
            sudo docker rm -f hello-welcome 2>/dev/null || true
            sudo docker run -d --name hello-welcome --restart unless-stopped -p 80:8080 "$IMAGE_NAME"
            sudo docker image prune -f